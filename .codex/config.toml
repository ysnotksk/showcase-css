# Codex CLI per-project config — populated by init-project.sh from posture.
# Reference: https://developers.openai.com/codex/config-reference
#
# sandbox_mode  : read-only | workspace-write | danger-full-access
# approval_policy: untrusted | on-request | never  (on-failure is deprecated)
#
# Solo       : sandbox_mode = workspace-write, approval_policy = on-request
# Team       : sandbox_mode = workspace-write, approval_policy = untrusted
# Enterprise : sandbox_mode = read-only,       approval_policy = untrusted

sandbox_mode   = "workspace-write"
approval_policy = "on-request"

# Shared MCP server allowlist — single source of truth at templates/mcp/servers.json.
# init-project.sh expands `[mcp_servers.<id>]` blocks here from that file.
# {{MCP_SERVERS_BLOCK}}
