# ci-kit v1 (ysnotksk/ci-kit): edit there and re-sync, not here.
# Actions are SHA-pinned (defence against mutable tags); Dependabot keeps the
# pins current. One grouped PR a month instead of one PR per action.
# Security updates are separate and still open as soon as an alert appears.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(actions)"
    open-pull-requests-limit: 5
