# Pillar 3: Supply Chain Provenance — CycloneDX SBOM generation on release.
# Uses Anchore's official syft action; supports npm, pypi, go, cargo, maven, ruby, composer, etc.
# Posture: enabled in Team and Enterprise; Solo can opt in by setting the workflow on:
#   release:
#     types: [published]
# Reference (primary): https://github.com/anchore/sbom-action

name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cyclonedx:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release assets only; the workflow itself stays read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
          upload-release-assets: true
