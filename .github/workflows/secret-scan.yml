name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main]

# Explicit permissions are required for Dependabot-triggered runs, where the
# default GITHUB_TOKEN is read-only. gitleaks-action lists PR commits via the
# REST API and posts a summary, so it needs both contents:read and
# pull-requests:read at minimum.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
