name: Secret Scanning

on:
  pull_request:
  push:
    branches: [main]

# Explicit permissions are required for Dependabot-triggered runs, where the
# default GITHUB_TOKEN is read-only. gitleaks-action lists PR commits via the
# REST API and posts a summary, so it needs both contents:read and
# pull-requests:read at minimum.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
