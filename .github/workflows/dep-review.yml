# Pillar 3: Supply Chain Provenance — review dependency changes on PRs.
# Uses GitHub's official dependency-review-action; requires Dependency Graph enabled (free).
# Reference (primary): https://github.com/actions/dependency-review-action

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: high
